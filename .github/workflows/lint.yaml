name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: yokawasa/action-setup-kube-tools@f8b2f6cdd1eb8575530049beacfe5d04c0ea8944 # v0.14.1
        with:
          setup-tools: |
            helm
            kubeconform
          helm: '3.15.1'
          kubeconform: '0.7.0'

      - run: helm lint .
      - run: helm template . -f values.yaml | kubeconform -summary
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.2 || true
      - run: helm unittest .
