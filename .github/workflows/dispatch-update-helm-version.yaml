name: Dispatch helm update
on:
  workflow_call:
    inputs:
      repo:
        description: The target repository to dispatch the version update
        required: true
        type: string
      version:
        description: The new helm version to apply
        required: true
        type: string
permissions: {}
jobs:
  dispatch-update-helm-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.COBROWSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COBROWSE_BOT_KEY }}
          permission-actions: write
          repositories: '${{ github.repository_owner}}/${{ inputs.repo }}'
      - name: Repository dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: '${{ inputs.repo }}',
              workflow_id: 'bump-helm-version.yaml',
              ref: 'master',
              inputs: {
                version: '${{ inputs.version }}'
              }
            })
